[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-graveyard"
version = "0.1.0"
description = "Self-healing failure memory for AI agents"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.1",
    "rich>=13.7.1",
    "websockets>=12.0"
]
